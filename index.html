<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Антифіш</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, like a phone inbox. Header with tabs, then a single working area (home, message card, result). */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #14212B;
  --muted: #566774;
  --line: #D3DAE0;
  --accent: #0E6B6F;
  --accent-ink: #FFFFFF;
  --danger: #B3261E;
  --danger-bg: #FBE8E6;
  --ok: #1B7A46;
  --ok-bg: #E2F3E9;
  --warn: #7A5200;
  --warn-bg: #FFF0CC;
  --font-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161C; --surface: #17222B; --surface-2: #1D2B36; --ink: #E6EDF2; --muted: #96A6B2; --line: #2B3A46;
    --accent: #4FC3C8; --accent-ink: #06282A; --danger: #FF8F86; --danger-bg: #3B1D1B; --ok: #72D69E; --ok-bg: #14301F;
    --warn: #F2C766; --warn-bg: #352A10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161C; --surface: #17222B; --surface-2: #1D2B36; --ink: #E6EDF2; --muted: #96A6B2; --line: #2B3A46;
  --accent: #4FC3C8; --accent-ink: #06282A; --danger: #FF8F86; --danger-bg: #3B1D1B; --ok: #72D69E; --ok-bg: #14301F;
  --warn: #F2C766; --warn-bg: #352A10; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.2; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; line-height: 1.3; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand i::after { content: ""; width: 10px; height: 10px; border: 2.5px solid var(--accent-ink); border-radius: 50%; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.lead { color: var(--muted); max-width: 62ch; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
label.f { display: grid; gap: 5px; font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
input[type="text"] { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 6px; transition: border-color .15s, transform .15s; }
.mode:hover { border-color: var(--accent); }
.mode b { font-family: var(--font-display); font-weight: 500; font-size: 0.95rem; }
.mode span { color: var(--muted); font-size: 0.875rem; }
.mode em { font-style: normal; font-size: 0.8125rem; font-weight: 600; color: var(--accent); }
details.box { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
details.box > summary { cursor: pointer; padding: 11px 14px; font-weight: 500; font-size: 0.9375rem; }
details.box > .in { padding: 0 14px 14px; display: grid; gap: 8px; font-size: 0.9375rem; }
details.box ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; }
.mono { font-family: var(--font-mono); font-size: 0.875em; }

/* progress */
.prog { display: grid; gap: 8px; }
.prog-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.875rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* message cards */
.chip { display: inline-block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.msg { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; }
.from { font-weight: 600; overflow-wrap: anywhere; }
.sub { font-size: 0.8125rem; color: var(--muted); }
.subj { font-size: 1.0625rem; font-weight: 600; padding-top: 4px; border-top: 1px solid var(--line); padding-block: 12px 0; }
.body { display: grid; gap: 10px; overflow-wrap: anywhere; }
.linkish { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; overflow-wrap: anywhere; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 12px 14px; display: grid; gap: 8px; overflow-wrap: anywhere; }
.reveal { border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 9px 12px; font-size: 0.875rem; overflow-wrap: anywhere; }
.reveal b { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 0.875rem; font-weight: 500; }
.tool[aria-pressed="true"] { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }

/* answering */
.conf { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.conf legend { font-size: 0.8125rem; font-weight: 500; color: var(--muted); padding: 0; margin-bottom: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; text-align: center; padding: 8px 6px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.8125rem; background: var(--surface-2); }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 14px 16px; font-weight: 600; font-size: 1rem; }
.btn.phish { background: var(--danger); color: var(--surface); }
.btn.safe { background: var(--ok); color: var(--surface); }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
:root[data-theme="dark"] .btn.phish, :root[data-theme="dark"] .btn.safe { color: #0E161C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.phish, :root:not([data-theme="light"]) .btn.safe { color: #0E161C; } }

/* feedback */
.fb { border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.fb.ok { background: var(--ok-bg); }
.fb.bad { background: var(--danger-bg); }
.fb h3 { font-size: 1.0625rem; }
.fb.ok h3 { color: var(--ok); }
.fb.bad h3 { color: var(--danger); }
.signs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.signs li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 0.9375rem; }
.tag { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; margin-top: 2px; white-space: nowrap; }
.tag.bad { background: var(--danger); color: var(--surface); }
.tag.ok { background: var(--ok); color: var(--surface); }
:root[data-theme="dark"] .tag.bad, :root[data-theme="dark"] .tag.ok { color: #0E161C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.bad, :root:not([data-theme="light"]) .tag.ok { color: #0E161C; } }

/* results */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.score big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.4rem, 10vw, 3.4rem); line-height: 1; }
.score span { color: var(--muted); }
.cats { display: grid; gap: 12px; }
.cat { display: grid; gap: 5px; }
.cat-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9375rem; }
.cat-row b { font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 99px; }
.m-classic { background: var(--warn); }
.m-ai { background: var(--danger); }
.m-legit { background: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.stat b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8125rem; color: var(--muted); }
.insight { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 0.9375rem; }
.review { display: grid; gap: 8px; }
.rv { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.rv > summary { cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; list-style: none; }
.rv > summary::-webkit-details-marker { display: none; }
.mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8125rem; font-weight: 700; }
.mark.y { background: var(--ok); color: var(--surface); }
.mark.n { background: var(--danger); color: var(--surface); }
.rv-t { min-width: 0; }
.rv-t b { display: block; overflow-wrap: anywhere; font-size: 0.9375rem; }
.rv-t span { font-size: 0.8125rem; color: var(--muted); }
.rv > .in { padding: 4px 12px 14px; display: grid; gap: 10px; }
textarea { width: 100%; min-height: 150px; font-family: var(--font-mono); font-size: 0.75rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* guide */
.stop { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.stop > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.stop .ltr { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--accent); line-height: 1; }
.stop p { font-size: 0.9375rem; color: var(--muted); }
ul.plain { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; }
.note { font-size: 0.8125rem; color: var(--muted); }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.step-n { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; }
.step-b { display: grid; gap: 8px; min-width: 0; }
.step-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.step-b p { color: var(--muted); font-size: 0.9375rem; }
.state { font-size: 0.75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.state.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.err { color: var(--danger); font-size: 0.875rem; font-weight: 500; }
textarea.short { min-height: 96px; }
a.btn { text-decoration: none; display: inline-block; }
.btn.sm { padding: 10px 14px; font-size: 0.9375rem; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 500; font-size: 0.8125rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

var S = { db: null, dbCodes: [], sheetCodes: [], sheetState: "off", skey: "", db: null, dbState: "off", saved: "", view: "home", stage: "pre", mode: "test", pid: "", cls: "", n: 16, date: "", setid: "", code: "", err: "", q: [], i: 0, ans: [], t0: 0, sender: false, link: false, conf: 2, fb: null, dataText: "", ana: null };
function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
S.pid = ls("af2_pid", ""); S.cls = ls("af2_cls", "");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(n, d) { return d ? Math.round(n * 100 / d) : 0; }
function byId(id) { for (var i = 0; i < MSGS.length; i++) if (MSGS[i].id === id) return MSGS[i]; return null; }
function pkey(p) { return String(p || "").trim().toLowerCase().replace(/\s+/g, " "); }
function orderFor(key) { var s = 0; for (var i = 0; i < key.length; i++) s += key.charCodeAt(i); return s % 2 === 0 ? { pre: "A", post: "B" } : { pre: "B", post: "A" }; }
function setMsgs(k) { return SETS[k].map(byId); }
function pickSet(n) {
  var plan = PLAN[n] || PLAN[16], kinds = ["classic", "ai", "legit"], out = [];
  kinds.forEach(function (k, idx) { out = out.concat(shuffle(MSGS.filter(function (m) { return m.origin === k; })).slice(0, plan[idx])); });
  return shuffle(out);
}
function isDone(stage) { var m = ls("af2_done", {})[pkey(S.pid)]; return !!(m && m[stage]); }
function markDone(stage) { var all = ls("af2_done", {}), k = pkey(S.pid); all[k] = all[k] || {}; all[k][stage] = S.date; lsSet("af2_done", all); }
function syncInputs() {
  var p = document.getElementById("pid"), c = document.getElementById("cls");
  if (p) S.pid = p.value; if (c) S.cls = c.value;
  var d = document.getElementById("codes"); if (d) S.dataText = d.value;
  var k = document.getElementById("skey"); if (k) S.skey = k.value;
}

/* ---------- Розмітка: загальне ---------- */
function header() {
  var tabs = [["home", "Тренажер"], ["guide", "Пам’ятка СТОП"], ["data", "Дані"], ["about", "Про проєкт"]];
  var cur = S.view === "quiz" || S.view === "result" ? "home" : S.view;
  return '<header class="top"><div class="brand"><i></i>Антифіш</div><nav class="tabs" aria-label="Розділи">' +
    tabs.map(function (t) { return '<button class="tab" data-act="tab" data-v="' + t[0] + '"' + (cur === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + "</button>"; }).join("") +
    "</nav></header>";
}
function linkBlock(m) { return m.link ? '<p><span class="linkish">' + esc(m.link.text) + "</span></p>" : ""; }
function msgHTML(m) {
  var paras = m.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  var initial = esc(m.from.replace(/[^A-Za-zА-Яа-яІіЇїЄєҐґ0-9+]/g, "").charAt(0) || "?");
  var inner;
  if (m.channel === "email") {
    inner = '<div class="who"><div class="avatar" aria-hidden="true">' + initial + '</div><div><div class="from">' + esc(m.from) + '</div><div class="sub">Кому: вам</div></div></div>' +
      '<div class="subj">' + esc(m.subject) + "</div>" + '<div class="body">' + paras + linkBlock(m) + "</div>";
  } else {
    inner = '<div class="who"><div class="avatar" aria-hidden="true">' + initial + '</div><div><div class="from">' + esc(m.from) + '</div><div class="sub">' + (m.channel === "sms" ? "SMS" : "Месенджер") + ", сьогодні</div></div></div>" +
      '<div class="bubble">' + paras + linkBlock(m) + "</div>";
  }
  var ctx = m.ctx ? '<p class="sub"><b>Ситуація:</b> ' + esc(m.ctx) + "</p>" : "";
  return '<article class="msg" aria-label="Повідомлення"><div><span class="chip">' + CHANNEL[m.channel] + "</span></div>" + ctx + inner + "</article>";
}
function signsHTML(m) {
  return '<ul class="signs">' + m.signs.map(function (s) { return '<li><span class="tag ' + s.k + '">' + esc(s.t) + "</span><span>" + esc(s.x) + "</span></li>"; }).join("") + "</ul>";
}

/* ---------- Головна ---------- */
function stageCard(num, key, title, text, btns) {
  var d = isDone(key);
  return '<div class="step"><div class="step-n">' + num + '</div><div class="step-b"><div class="step-h"><h3>' + title + '</h3><span class="state' + (d ? " done" : "") + '">' + (d ? "Пройдено" : "Не пройдено") + "</span></div><p>" + text + '</p><div class="row">' + btns + "</div></div></div>";
}
function viewHome() {
  return '<section class="panel"><h1>Фішинг чи справжнє повідомлення?</h1>' +
    '<p class="lead">Листи, SMS і чати: частину написали шахраї за старими шаблонами, частину створив штучний інтелект, решта справжні. Для кожного вирішіть, чи можна йому довіряти.</p>' +
    '<div class="fields"><label class="f" for="pid">Код учасника<input type="text" id="pid" value="' + esc(S.pid) + '" autocomplete="off" placeholder="наприклад, 9Б-07"></label>' +
    '<label class="f" for="cls">Клас або група<input type="text" id="cls" value="' + esc(S.cls) + '" autocomplete="off" placeholder="наприклад, 9-Б"></label></div>' +
    '<p class="note">Код видає вчитель. Не вводьте прізвище.</p>' +
    (S.err ? '<p class="err" role="alert">' + esc(S.err) + "</p>" : "") +
    "</section>" +
    '<section class="panel"><h2>Три етапи</h2><div class="steps">' +
    stageCard(1, "pre", "Тест до навчання", "16 повідомлень без підказок. Розбір відповідей не показується, щоб не вплинути на другий тест.",
      '<button class="btn main sm" data-act="begin" data-stage="pre">Почати тест</button>') +
    stageCard(2, "train", "Навчання", "Прочитайте пам’ятку «СТОП», а потім розберіть 8 повідомлень. Після кожної відповіді буде пояснення.",
      '<button class="btn ghost sm" data-act="tab" data-v="guide">Пам’ятка СТОП</button><button class="btn main sm" data-act="begin" data-stage="train">Почати навчання</button>') +
    stageCard(3, "post", "Тест після навчання", "Інші 16 повідомлень, теж без підказок. Після нього покажемо розбір і порівняння з першим тестом.",
      '<button class="btn main sm" data-act="begin" data-stage="post">Почати тест</button>') +
    "</div></section>" +
    '<section class="panel"><details class="box"><summary>Вільне тренування (випадкові повідомлення з бази)</summary><div class="in">' +
    '<p class="note">Для знайомства з тренажером. Результати цього режиму не враховуються у дослідженні.</p>' +
    '<fieldset class="conf"><legend>Скільки повідомлень</legend><div class="seg">' +
    [12, 16, 24].map(function (n) { return '<label><input type="radio" name="len" value="' + n + '"' + (S.n === n ? " checked" : "") + "><span>" + n + "</span></label>"; }).join("") +
    '</div></fieldset><div class="modes">' +
    '<button class="mode" data-act="begin" data-stage="free" data-mode="train"><em>Режим</em><b>Навчання</b><span>Розбір після кожної відповіді.</span></button>' +
    '<button class="mode" data-act="begin" data-stage="free" data-mode="test"><em>Режим</em><b>Тест</b><span>Розбір наприкінці.</span></button>' +
    "</div></div></details>" +
    '<details class="box"><summary>Ситуація, яку ви граєте</summary><div class="in"><ul>' +
    CONTEXT.map(function (c) { return "<li><b>" + c[0] + ":</b> " + esc(c[1]) + "</li>"; }).join("") +
    "</ul><p class=\"note\">Усі назви вигадані. Під час відповіді можна перевірити відправника й адресу, куди веде посилання.</p></div></details>" +
    "</section>";
}

/* ---------- Питання ---------- */
function viewQuiz() {
  var m = S.q[S.i], n = S.q.length;
  var label = S.stage === "free" ? (S.mode === "train" ? "Навчання" : "Тест") : STAGE_NAME[S.stage];
  var h = '<section class="panel"><div class="prog"><div class="prog-row"><span>Повідомлення ' + (S.i + 1) + " з " + n + "</span><span>" + label + '</span></div><div class="bar"><span style="width:' + Math.round(S.i * 100 / n) + '%"></span></div></div>';
  h += msgHTML(m);
  if (S.sender) h += '<div class="reveal"><b>Деталі відправника</b><span class="mono">' + esc(m.det) + "</span></div>";
  if (S.link && m.link) h += '<div class="reveal"><b>Посилання веде на</b><span class="mono">' + esc(m.link.real) + "</span></div>";
  if (!S.fb) {
    h += '<div class="tools"><button class="tool" data-act="sender" aria-pressed="' + S.sender + '">Деталі відправника</button>';
    if (m.link) h += '<button class="tool" data-act="link" aria-pressed="' + S.link + '">Куди веде посилання</button>';
    h += "</div>";
    h += '<fieldset class="conf"><legend>Наскільки ви впевнені?</legend><div class="seg">' +
      [[1, "Вагаюсь"], [2, "Скоріше так"], [3, "Упевнений"]].map(function (c) {
        return '<label><input type="radio" name="conf" value="' + c[0] + '"' + (S.conf === c[0] ? " checked" : "") + "><span>" + c[1] + "</span></label>";
      }).join("") + "</div></fieldset>";
    h += '<div class="verdict"><button class="btn phish" data-act="answer" data-v="phish">Це фішинг</button><button class="btn safe" data-act="answer" data-v="safe">Це безпечно</button></div>';
  } else {
    var a = S.fb;
    h += '<section class="fb ' + (a.correct ? "ok" : "bad") + '" role="status"><h3>' + (a.correct ? "Правильно" : "Неправильно") + "</h3>" +
      "<p>Це було: <b>" + ORIGIN[m.origin] + "</b>. Ваша відповідь: " + (a.choice === "phish" ? "фішинг" : "безпечно") + ".</p>" +
      signsHTML(m) + '<div><button class="btn main" data-act="next" id="nextBtn">' + (S.i + 1 >= n ? "Показати результат" : "Далі") + "</button></div></section>";
  }
  return h + "</section>";
}

/* ---------- Підрахунки ---------- */
function stats() {
  var A = S.ans, cat = { classic: [0, 0], ai: [0, 0], legit: [0, 0] };
  var missed = 0, falseAlarm = 0, nPhish = 0, nLegit = 0, time = 0, cOk = [], cBad = [], us = 0, ul = 0, nl = 0;
  A.forEach(function (a) {
    cat[a.origin][1]++;
    if (a.correct) cat[a.origin][0]++;
    if (a.phish) { nPhish++; if (a.choice === "safe") missed++; } else { nLegit++; if (a.choice === "phish") falseAlarm++; }
    time += a.secs; (a.correct ? cOk : cBad).push(a.conf);
    if (a.sender) us++;
    if (a.hasLink) { nl++; if (a.link) ul++; }
  });
  function avg(x) { return x.length ? x.reduce(function (p, c) { return p + c; }, 0) / x.length : null; }
  var ok = cat.classic[0] + cat.ai[0] + cat.legit[0];
  return { cat: cat, ok: ok, n: A.length, missed: missed, nPhish: nPhish, falseAlarm: falseAlarm, nLegit: nLegit, avgTime: A.length ? time / A.length : 0, confOk: avg(cOk), confBad: avg(cBad), us: us, ul: ul, nl: nl };
}
function insight(st) {
  var c = st.cat.classic, a = st.cat.ai, pc = pct(c[0], c[1]), pa = pct(a[0], a[1]), t;
  if (pa < pc) t = "Фішинг від ШІ ви розпізнали гірше (" + pa + "%), ніж класичний (" + pc + "%). Без помилок у тексті довіряти хочеться більше, тому перевіряйте відправника, посилання і прохання, а не мову.";
  else if (pa > pc) t = "Фішинг від ШІ ви розпізнали краще (" + pa + "%), ніж класичний (" + pc + "%). Схоже, ви перевіряєте відправника й адресу, а не помилки.";
  else t = "Обидва види фішингу ви розпізнали однаково добре (" + pa + "%).";
  if (st.nLegit && st.falseAlarm > 0) t += " Ви ще й " + st.falseAlarm + " раз(и) визнали справжнє повідомлення фішингом. Надмірна підозріливість теж дає збої, наприклад, ви можете пропустити важливий лист.";
  return t;
}

/* ---------- Код результату ---------- */
function makeCode() {
  function c(v) { return String(v || "").replace(/[|,:\r\n]/g, "_").trim(); }
  var ans = S.ans.map(function (a) { return [a.id, a.choice === "phish" ? "p" : "s", a.conf, a.secs.toFixed(1), a.sender ? 1 : 0, a.hasLink ? (a.link ? 1 : 0) : "-"].join(":"); }).join(",");
  return ["AF1", c(S.pid), c(S.cls), S.stage, S.setid, S.date, ans].join("|");
}
function parseCode(line) {
  var p = String(line).trim().split("|");
  if (p.length < 7 || p[0] !== "AF1") return null;
  var answers = p[6].split(",").map(function (t) {
    var f = t.split(":"), m = byId(f[0]);
    if (!m || f.length < 6) return null;
    var choice = f[1] === "p" ? "phish" : "safe";
    return { id: f[0], channel: m.channel, origin: m.origin, phish: m.phish, choice: choice, correct: (choice === "phish") === m.phish, conf: parseInt(f[2], 10) || 0, secs: parseFloat(f[3]) || 0, sender: f[4] === "1", hasLink: f[5] !== "-", link: f[5] === "1" };
  }).filter(Boolean);
  if (!answers.length) return null;
  return { pid: p[1], cls: p[2], stage: p[3], set: p[4], date: p[5], answers: answers };
}
function finish() {
  S.date = new Date().toISOString().replace(/\.\d+Z$/, "Z");
  S.code = makeCode();
  var codes = ls("af2_codes", []); codes.push(S.code); lsSet("af2_codes", codes.slice(-300));
  var st = stats();
  if (S.stage !== "free") {
    markDone(S.stage);
    var r = ls("af2_res", {}); r[pkey(S.pid) + "|" + S.stage] = { ok: st.ok, n: st.n, cat: st.cat }; lsSet("af2_res", r);
  }
  S.saved = (S.db || APPS_URL) && S.stage !== "free" ? "pending" : "local";
  S.view = "result"; render(); window.scrollTo(0, 0);
  saveRemote(st);
}

/* ---------- Спільна база ---------- */
function safeId(t) { return String(t).replace(/[^A-Za-z0-9_\-.~:@+]/g, function (c) { return "~" + c.charCodeAt(0).toString(16); }).slice(0, 190); }
function sendSheet(doc) {
  if (!APPS_URL) return Promise.resolve(false);
  return fetch(APPS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(doc) })
    .then(function (r) { return r.json(); }).then(function (j) { return !!(j && j.ok); }).catch(function () { return false; });
}
function saveRemote(st) {
  if (S.stage === "free" || (!S.db && !APPS_URL)) { S.saved = "local"; refreshSaveNote(); return; }
  var doc = { code: S.code, pid: S.pid, cls: S.cls, stage: S.stage, set: S.setid, date: S.date, ok: st.ok, n: st.n };
  var a = S.db ? S.db.collection("runs").doc(safeId(pkey(S.pid) + "_" + S.stage)).set(doc).then(function () { return true; }, function () { return false; }) : Promise.resolve(false);
  var b = sendSheet(doc);
  Promise.all([a, b]).then(function (r) { S.saved = r[0] || r[1] ? "shared" : "local"; refreshSaveNote(); });
}
function refreshSaveNote() {
  var el = document.getElementById("saveNote"); if (!el) return;
  el.textContent = S.saved === "shared" ? "Результат збережено в базі дослідження."
    : S.saved === "pending" ? "Зберігаю результат…"
    : S.stage === "free" ? "Вільне тренування не записується в дослідження."
    : "Автоматично зберегти не вдалося (немає доступу до спільної бази). Скопіюйте код і надішліть його вчителю.";
  var b = document.getElementById("formBtn"); if (b) b.hidden = S.saved === "shared";
}
function formLink() { return FORM_URL && FORM_ENTRY ? FORM_URL + (FORM_URL.indexOf("?") < 0 ? "?" : "&") + "usp=pp_url&" + encodeURIComponent(FORM_ENTRY) + "=" + encodeURIComponent(S.code) : ""; }
var unsub = null;
function startRemote() {
  if (!S.db || unsub) return;
  S.dbState = "loading";
  unsub = S.db.collection("runs").limit(1000).onSnapshot(function (snap) {
    S.dbCodes = snap.docs.map(function (d) { var x = d.data(); return x && x.code; }).filter(Boolean);
    S.dbState = "ok";
    if (S.view === "data") render();
  }, function () { S.dbState = "error"; S.dbCodes = []; if (S.view === "data") render(); });
}

/* ---------- Результат ---------- */
function viewResult() {
  var st = stats(), p = pct(st.ok, st.n), full = S.stage !== "pre";
  var names = { classic: "Класичний фішинг", ai: "Фішинг від ШІ", legit: "Справжні повідомлення" };
  var h = '<section class="panel"><h2>' + STAGE_NAME[S.stage] + (S.pid ? ": " + esc(S.pid) : "") + "</h2>" +
    '<div class="score"><big>' + st.ok + "/" + st.n + "</big><span>" + p + "% правильних відповідей</span></div>";
  if (S.stage === "pre") h += '<p class="lead">Дякуємо. Розбір і порівняння з другим тестом з’являться після третього етапу, щоб не вплинути на його результат. Далі: етап 2, навчання.</p>';
  if (S.stage === "post") {
    var pre = ls("af2_res", {})[pkey(S.pid) + "|pre"];
    if (pre) {
      var d = st.ok - pre.ok;
      h += '<div class="insight">До навчання: ' + pre.ok + " з " + pre.n + ". Після навчання: " + st.ok + " з " + st.n + ". Зміна: " + (d > 0 ? "+" : "") + d + ".</div>";
    }
  }
  if (S.stage === "train") h += '<p class="lead">Далі: етап 3, тест після навчання.</p>';
  if (full) {
    h += '<div class="cats">' + ["classic", "ai", "legit"].map(function (k) {
      var v = st.cat[k], pp = pct(v[0], v[1]);
      return '<div class="cat"><div class="cat-row"><span>' + names[k] + "</span><b>" + v[0] + " з " + v[1] + " · " + pp + '%</b></div><div class="meter"><span class="m-' + k + '" style="width:' + pp + '%"></span></div></div>';
    }).join("") + "</div>" +
      '<div class="insight">' + insight(st) + "</div>" +
      '<div class="stats">' +
      '<div class="stat"><b>' + st.missed + " з " + st.nPhish + "</b><span>фішингових повідомлень пропущено</span></div>" +
      '<div class="stat"><b>' + st.falseAlarm + " з " + st.nLegit + "</b><span>справжніх визнано фішингом</span></div>" +
      '<div class="stat"><b>' + st.avgTime.toFixed(1) + " с</b><span>середній час на повідомлення</span></div>" +
      '<div class="stat"><b>' + pct(st.us, st.n) + "%</b><span>разів перевірено відправника</span></div>" +
      '<div class="stat"><b>' + pct(st.ul, st.nl) + "%</b><span>разів перевірено адресу посилання</span></div>" +
      '<div class="stat"><b>' + (st.confOk == null ? "—" : st.confOk.toFixed(1)) + " / " + (st.confBad == null ? "—" : st.confBad.toFixed(1)) + "</b><span>впевненість: у правильних / у помилкових (1–3)</span></div></div>";
  }
  h += "</section>";

  if (full) {
    h += '<section class="panel"><h2>Розбір відповідей</h2><div class="review">' + S.ans.map(function (a, idx) {
      var m = byId(a.id), title = m.subject || m.body[0];
      return '<details class="rv"><summary><span class="mark ' + (a.correct ? "y" : "n") + '">' + (a.correct ? "✓" : "✗") + '</span><span class="rv-t"><b>' + (idx + 1) + ". " + esc(m.from) + " — " + esc(title.length > 70 ? title.slice(0, 70) + "…" : title) + "</b><span>" + ORIGIN[m.origin] + " · ваша відповідь: " + (a.choice === "phish" ? "фішинг" : "безпечно") + "</span></span></summary>" +
        '<div class="in">' + msgHTML(m) + signsHTML(m) + "</div></details>";
    }).join("") + "</div></section>";
  }

    "<h2>Збір даних</h2>" +
    '<p class="lead">Після кожного етапу результат автоматично записується в спільну базу дослідження. У розділі «Дані» сторінка сама рахує середні, зміну після навчання з t-критерієм для парних вибірок і порівняння фішингу від ШІ з класичним. Якщо запис у базу не вдався, учень отримує код результату й передає його вручну.</p>' +
    '<p class="note">Обмеження: набір невеликий, тому для висновків потрібна достатня кількість учасників (бажано не менше 30). Дані зберігаються в браузері учня, поки він не очистить його.</p></section>';
}

/* ---------- Керування ---------- */
function render() {
  var v = S.view, body;
  if (v === "home") body = viewHome();
  else if (v === "quiz") body = viewQuiz();
  else if (v === "result") body = viewResult();
  else if (v === "guide") body = viewGuide();
  else if (v === "data") body = viewData();
  else body = viewAbout();
  document.getElementById("app").innerHTML = header() + body;
  var nb = document.getElementById("nextBtn");
  if (nb) nb.focus();
  if (v === "result") refreshSaveNote();
}
function begin(stage, mode) {
  syncInputs();
  if (stage !== "free" && S.pid.trim().length < 2) {
    S.err = "Введіть код учасника (мінімум 2 символи), щоб почати етап.";
    render();
    return;
  }
  S.err = "";
  lsSet("af2_pid", S.pid); lsSet("af2_cls", S.cls);
  var o = orderFor(pkey(S.pid)), msgs;
  S.stage = stage; S.date = "";
  if (stage === "pre") { S.setid = o.pre; msgs = setMsgs(o.pre); S.mode = "test"; }
  else if (stage === "post") { S.setid = o.post; msgs = setMsgs(o.post); S.mode = "test"; }
  else if (stage === "train") { S.setid = "T"; msgs = setMsgs("T"); S.mode = "train"; }
  else {
    var L = document.querySelector('input[name="len"]:checked'); if (L) S.n = parseInt(L.value, 10);
    S.setid = "R"; msgs = pickSet(S.n); S.mode = mode || "train";
  }
  S.q = shuffle(msgs); S.i = 0; S.ans = []; S.view = "quiz"; startQ();
}
function startQ() { S.t0 = Date.now(); S.sender = false; S.link = false; S.conf = 2; S.fb = null; render(); window.scrollTo(0, 0); }
function answer(choice) {
  var m = S.q[S.i];
  var a = { id: m.id, channel: m.channel, origin: m.origin, phish: m.phish, choice: choice, correct: (choice === "phish") === m.phish, conf: S.conf, secs: (Date.now() - S.t0) / 1000, sender: S.sender, link: S.link, hasLink: !!m.link };
  S.ans.push(a);
  if (S.mode === "train") { S.fb = a; render(); } else next();
}
function next() { S.i++; if (S.i >= S.q.length) finish(); else startQ(); }
function copyFrom(id, btn) {
  var ta = document.getElementById(id), label = btn.textContent;
  function done(ok) { btn.textContent = ok ? "Скопійовано" : "Виділено: натисніть Ctrl+C"; setTimeout(function () { btn.textContent = label; }, 2500); }
  function fallback() { ta.focus(); ta.select(); done(false); }
  try { navigator.clipboard.writeText(ta.value).then(function () { done(true); }, fallback); } catch (e) { fallback(); }
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "tab") { syncInputs(); S.view = el.getAttribute("data-v"); render(); window.scrollTo(0, 0); }
  else if (act === "begin") begin(el.getAttribute("data-stage"), el.getAttribute("data-mode"));
  else if (act === "sender") { S.sender = !S.sender; render(); }
  else if (act === "link") { S.link = !S.link; render(); }
  else if (act === "answer") answer(el.getAttribute("data-v"));
  else if (act === "next") next();
  else if (act === "copy") copyFrom(el.getAttribute("data-target"), el);
  else if (act === "again") { S.view = "home"; S.err = ""; render(); window.scrollTo(0, 0); }
  else if (act === "analyze") { syncInputs(); S.ana = analyze(S.dataText); render(); }
  else if (act === "addlocal") {
    syncInputs();
    var have = {}; S.dataText.split(/\r?\n/).forEach(function (l) { have[l.trim()] = 1; });
    var add = ls("af2_codes", []).filter(function (c) { return !have[c]; });
    S.dataText = (S.dataText.trim() ? S.dataText.replace(/\s+$/, "") + "\n" : "") + add.join("\n");
    render();
  }
  else if (act === "loadsheet") {
    syncInputs(); S.sheetState = "loading"; render();
    fetch(APPS_URL + (APPS_URL.indexOf("?") < 0 ? "?" : "&") + "key=" + encodeURIComponent(S.skey.trim()))
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { S.sheetCodes = j.codes || []; S.sheetState = "ok"; } else { S.sheetState = "error"; } render(); })
      .catch(function () { S.sheetState = "error"; render(); });
  }
  else if (act === "clearcodes") { S.dataText = ""; S.ana = null; render(); }
});
document.addEventListener("change", function (e) {
  if (e.target.name === "conf") S.conf = parseInt(e.target.value, 10);
  else if (e.target.name === "len") S.n = parseInt(e.target.value, 10);
  else if (e.target.id === "pid" || e.target.id === "cls") syncInputs();
});
render();
try {
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (db) {
      if (!db) return;
      S.db = db; startRemote(); syncInputs(); render();
    }, function () {});
  }
} catch (e) {}
</script>
